<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us | Assam Finance Hub</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header class="header">

<div class="container">

<div class="logo">
<h2>Assam Finance Hub</h2>
</div>

<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="status.html">Status</a>
<a href="contact.html">Contact</a>
</nav>

</div>

</header>

<section class="contact-page">

<div class="container">

<h1>Contact Us</h1>

<p>
Need help? Contact our support team anytime.
</p>

<div class="cards">

<div class="card">

<i class="fas fa-phone fa-3x"></i>

<h3>Phone</h3>

<p>+91 9876543210</p>

</div>

<div class="card">

<i class="fas fa-envelope fa-3x"></i>

<h3>Email</h3>

<p>support@assamfinancehub.in</p>

</div>

<div class="card">

<i class="fas fa-location-dot fa-3x"></i>

<h3>Office</h3>

<p>Guwahati, Assam, India</p>

</div>

</div>

<br><br>

<form id="contactForm">

<input
type="text"
placeholder="Full Name"
required>

<input
type="email"
placeholder="Email Address"
required>

<input
type="tel"
placeholder="Mobile Number"
required>

<textarea
rows="6"
placeholder="Write your message..."
required></textarea>

<button
class="btn"
type="submit">

Send Message

</button>

</form>

</div>

</section>

<footer>

<div class="container">

<p>

© 2026 Assam Finance Hub. All Rights Reserved.

</p>

</div>

</footer>

<script>

document.getElementById("contactForm").addEventListener("submit",function(e){

e.preventDefault();

alert("Thank you! Your message has been submitted.");

this.reset();

});

</script>

</body>

</html>
