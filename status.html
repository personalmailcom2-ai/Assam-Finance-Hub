<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Status - Assam Finance Hub</title>

<style>
body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#f2f5f9;
}

.container{
max-width:450px;
margin:40px auto;
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h2{
text-align:center;
margin-bottom:20px;
color:#0d47a1;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#1565c0;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0d47a1;
}

#result{
margin-top:20px;
}

.card{
background:#f8f9fa;
padding:15px;
border-radius:10px;
border:1px solid #ddd;
line-height:1.8;
}

.pending{
color:#ff9800;
font-weight:bold;
}

.approved{
color:green;
font-weight:bold;
}

.rejected{
color:red;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>Check Loan Status</h2>

<input
type="text"
id="mobile"
placeholder="Enter Mobile Number">

<button onclick="checkStatus()">
Check Status
</button>

<div id="result"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyAnQFG-tdce0gxxfEhIYdpr6BJDcQgbW",
authDomain:"assam-finance-hub.firebaseapp.com",
projectId:"assam-finance-hub",
storageBucket:"assam-finance-hub.firebasestorage.app",
messagingSenderId:"989678663450",
appId:"1:989678663450:web:d0499bf58d8dd382325ea3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.checkStatus = async () => {

const mobile = document.getElementById("mobile").value.trim();

const result = document.getElementById("result");

result.innerHTML = "";

const q = query(
collection(db,"applications"),
where("mobile","==",mobile)
);

const snap = await getDocs(q);

if(snap.empty){

result.innerHTML =
"<div class='card'>❌ No Application Found</div>";

return;

}

snap.forEach(doc=>{

const data = doc.data();

let statusClass="pending";

if(data.status==="Approved") statusClass="approved";

if(data.status==="Rejected") statusClass="rejected";

result.innerHTML = `
<div class="card">

<b>Name:</b> ${data.name}<br>

<b>Mobile:</b> ${data.mobile}<br>

<b>Bike:</b> ${data.bike}<br>

<b>City:</b> ${data.city}<br>

<b>Status:</b>
<span class="${statusClass}">
${data.status}
</span>

</div>
`;

});

}

</script>

</body>
</html>
