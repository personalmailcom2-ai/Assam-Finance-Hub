<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Check Loan Status</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

<div class="logo">

🚲 Assam Finance Hub

</div>

<nav>

<a href="index.html">Home</a>

<a href="index.html#apply">Apply Loan</a>

</nav>

</header>

<section class="form-box">

<h2>

Check Application Status

</h2>

<input
type="tel"
id="mobile"
placeholder="Enter Mobile Number"
maxlength="10">

<button id="checkBtn">

Check Status

</button>

<div
id="result"
class="status-box"
style="display:none;">

<h3>Application Details</h3>

<p><b>Name:</b> <span id="rName"></span></p>

<p><b>Mobile:</b> <span id="rMobile"></span></p>

<p><b>Bike:</b> <span id="rBike"></span></p>

<p><b>City:</b> <span id="rCity"></span></p>

<p><b>Status:</b> <span id="rStatus"></span></p>

</div>

<div
id="notFound"
class="error-box">

Application Not Found

</div>

  </section>

<footer>

<h2>Assam Finance Hub</h2>

<p>Bike Loan • Fast Approval • Easy EMI</p>

</footer>

<script type="module">

import { app } from "./firebase.js";

import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const db = getFirestore(app);

const checkBtn = document.getElementById("checkBtn");

checkBtn.addEventListener("click", async()=>{

const mobile =
document.getElementById("mobile").value.trim();

if(mobile.length!==10){

alert("Enter Valid Mobile Number");

return;

}

const snapshot =
await getDocs(collection(db,"applications"));

let found = false;

document.getElementById("result").style.display="none";
document.getElementById("notFound").style.display="none";

snapshot.forEach((doc)=>{

const data = doc.data();

if(data.mobile===mobile){

found = true;

document.getElementById("rName").innerText = data.name || "";

document.getElementById("rMobile").innerText = data.mobile || "";

document.getElementById("rBike").innerText = data.bike || "";

document.getElementById("rCity").innerText = data.city || "";

document.getElementById("rStatus").innerText =
data.status || "Pending";

document.getElementById("result").style.display="block";

}

});

if(!found){

document.getElementById("notFound").style.display="block";

}

});

</script>

</body>

</html>
