<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
margin:0;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

h2{
margin:0;
}

.dashboard{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:20px;
}

.box{
background:#fff;
padding:15px;
border-radius:10px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.box h3{
margin:0;
font-size:28px;
color:#0B5ED7;
}

.card{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.2);
}

button{
padding:10px 18px;
margin:5px;
border:none;
border-radius:5px;
cursor:pointer;
color:white;
}

.approve{
background:green;
}

.reject{
background:red;
}

.delete{
background:black;
}

.logout{
background:#d32f2f;
}

</style>

</head>

<body>

<div class="header">

<h2>Loan Applications</h2>

<button
id="logoutBtn"
class="logout">
Logout
</button>

</div>

<div class="dashboard">

<div class="box">
<h3 id="totalCount">0</h3>
<p>Total</p>
</div>

<div class="box">
<h3 id="pendingCount">0</h3>
<p>Pending</p>
</div>

<div class="box">
<h3 id="approvedCount">0</h3>
<p>Approved</p>
</div>

<div class="box">
<h3 id="rejectedCount">0</h3>
<p>Rejected</p>
</div>

</div>

<div id="list">
Loading...
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc,
deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={
apiKey:"AIzaSyAnQPG-tdceOqxxfEzHIYdpr6pBJDcOgbM",
authDomain:"assam-finance-hub.firebaseapp.com",
projectId:"assam-finance-hub",
storageBucket:"assam-finance-hub.firebasestorage.app",
messagingSenderId:"989678663450",
appId:"1:989678663450:web:d0499bf58d8dd382325ea3",
measurementId:"G-H15X3EDQJW"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

const list=document.getElementById("list");

  onAuthStateChanged(auth,(user)=>{

if(!user){
window.location.href="admin-login.html";
return;
}

loadData();

});

document.getElementById("logoutBtn").onclick=async()=>{

await signOut(auth);

window.location.href="admin-login.html";

};

async function loadData(){

list.innerHTML="Loading...";

const snapshot=await getDocs(collection(db,"applications"));

const docs=snapshot.docs.reverse();

let total=0;
let pending=0;
let approved=0;
let rejected=0;

list.innerHTML="";

docs.forEach((d)=>{

const x=d.data();

total++;

if(x.status==="Approved"){
approved++;
}else if(x.status==="Rejected"){
rejected++;
}else{
pending++;
}

list.innerHTML+=`

<div class="card">

<h3>${x.name||""}</h3>

<p><b>Mobile:</b> ${x.mobile||""}</p>

<p><b>Bike:</b> ${x.bike||""}</p>

<p><b>City:</b> ${x.city||""}</p>

<p><b>Status:</b> ${x.status||"Pending"}</p>

<button
class="approve"
onclick="changeStatus('${d.id}','Approved')">
Approve
</button>

<button
class="reject"
onclick="changeStatus('${d.id}','Rejected')">
Reject
</button>

<button
class="delete"
onclick="deleteApplication('${d.id}')">
Delete
</button>

</div>

`;

});

document.getElementById("totalCount").innerHTML=total;
document.getElementById("pendingCount").innerHTML=pending;
document.getElementById("approvedCount").innerHTML=approved;
document.getElementById("rejectedCount").innerHTML=rejected;

if(total===0){
list.innerHTML="<h3>No Applications Found</h3>";
}

}

  window.changeStatus = async(id,status)=>{

try{

await updateDoc(doc(db,"applications",id),{

status:status

});

alert("Status Updated Successfully");

loadData();

}catch(err){

console.error(err);

alert(err.message);

}

};

window.deleteApplication = async(id)=>{

const ok=confirm("Delete this application?");

if(!ok) return;

try{

await deleteDoc(doc(db,"applications",id));

alert("Application Deleted Successfully");

loadData();

}catch(err){

console.error(err);

alert(err.message);

}

};

  loadData();

</script>

</body>
</html>
