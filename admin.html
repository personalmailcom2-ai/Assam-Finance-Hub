<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
margin:0;
}

h2{
text-align:center;
}

.card{
background:#fff;
padding:15px;
margin:15px 0;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.2);
}

button{
padding:10px 18px;
margin:5px;
border:none;
border-radius:5px;
cursor:pointer;
color:white;
font-size:15px;
}

.approve{
background:green;
}

.reject{
background:red;
}
</style>
</head>

<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAnQPG-tdceOqxxfEzHIYdpr6pBJDcOgbM",
  authDomain: "assam-finance-hub.firebaseapp.com",
  projectId: "assam-finance-hub",
  storageBucket: "assam-finance-hub.firebasestorage.app",
  messagingSenderId: "989678663450",
  appId: "1:989678663450:web:d0499bf58d8dd382325ea3",
  measurementId: "G-H1SX3EDQJM"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Check login
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "admin-login.html";
  }
});

// Wait until page is loaded
window.onload = () => {
  const btn = document.getElementById("logoutBtn");

  if (btn) {
    btn.onclick = async () => {
      await signOut(auth);
      window.location.href = "admin-login.html";
    };
  }
};
</script>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">

<h2>Loan Applications</h2>

<button id="logoutBtn"
style="background:#d32f2f;padding:10px 18px;border:none;border-radius:5px;color:white;cursor:pointer;">
Logout
</button>

</div>

<div id="list">Loading...</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAnQPG-tdceOqxxfEzHIYdpr6pBJDcOgbM",
  authDomain: "assam-finance-hub.firebaseapp.com",
  projectId: "assam-finance-hub",
  storageBucket: "assam-finance-hub.firebasestorage.app",
  messagingSenderId: "989678663450",
  appId: "1:989678663450:web:d0499bf58d8dd382325ea3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("list");

async function loadData(){

list.innerHTML="";

const snapshot = await getDocs(collection(db,"applications"));

snapshot.forEach((d)=>{

const x = d.data();

if(!x.name || !x.mobile) return;

list.innerHTML += `
<div class="card">

<h3>${x.name || ""}</h3>

<p><b>Mobile:</b> ${x.mobile || ""}</p>

<p><b>Bike:</b> ${x.bike || ""}</p>

<p><b>City:</b> ${x.city || ""}</p>

<p><b>Status:</b> ${x.status || "Pending"}</p>

<button class="approve"
onclick="changeStatus('${d.id}','Approved')">
Approve
</button>

<button class="reject"
onclick="changeStatus('${d.id}','Rejected')">
Reject
</button>

</div>
`;

});

}

window.changeStatus = async(id,status)=>{

await updateDoc(doc(db,"applications",id),{
status:status
});

alert("Status Updated Successfully");

loadData();

}

loadData();

</script>

</body>
</html>
