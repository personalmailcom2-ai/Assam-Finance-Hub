<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | Assam Finance Hub</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header class="admin-header">

<div class="container">

<div class="admin-logo">

<i class="fa-solid fa-building-columns"></i>

<h2>Assam Finance Hub</h2>

</div>

<div class="admin-actions">

<button id="refreshBtn" class="btn">

<i class="fa-solid fa-rotate"></i>

Refresh

</button>

<button id="logoutBtn" class="btn">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>

</div>

</div>

</header>

<section class="dashboard">

<div class="container">

<h1>

<i class="fa-solid fa-chart-line"></i>

Admin Dashboard

</h1>

<p>

Manage all bike loan applications from one place.

</p>

</div>

</section>

<section class="stats">

<div class="container">

<div class="cards">

<div class="card">

<h3>Total Applications</h3>

<h2 id="totalCount">0</h2>

</div>

<div class="card">

<h3>Pending</h3>

<h2 id="pendingCount">0</h2>

</div>

<div class="card">

<h3>Approved</h3>

<h2 id="approvedCount">0</h2>

</div>

<div class="card">

<h3>Rejected</h3>

<h2 id="rejectedCount">0</h2>

</div>

</div>

</div>

</section>

  <section class="admin-tools">

<div class="container">

<div class="tool-bar">

<input
type="text"
id="searchInput"
placeholder="🔍 Search by Name or Mobile">

<select id="statusFilter">

<option value="all">All Status</option>

<option value="Pending">Pending</option>

<option value="Approved">Approved</option>

<option value="Rejected">Rejected</option>

</select>

<button class="btn" id="exportBtn">

<i class="fa-solid fa-file-excel"></i>

Export Excel

</button>

<button class="btn" id="printBtn">

<i class="fa-solid fa-print"></i>

Print

</button>

</div>

</div>

</section>

<section class="applications">

<div class="container">

<h2>

<i class="fa-solid fa-list"></i>

Loan Applications

</h2>

<div id="applicationsContainer">

<!-- Applications will load here -->

</div>

</div>

</section>

<!-- Application Details Modal -->

<div class="modal" id="detailsModal">

<div class="modal-content">

<span id="closeModal" style="float:right;cursor:pointer;font-size:28px;">&times;</span>

<h2>Application Details</h2>

<div id="modalBody">

</div>

</div>

</div>

  <!-- Loading Overlay -->

<div id="adminLoader">

<div class="spinner"></div>

<p>Loading Applications...</p>

</div>

<!-- Toast Notification -->

<div id="toastNotification" class="toast">

<span id="toastMessage">

Welcome Admin

</span>

</div>

<!-- Dashboard Footer -->

<footer class="admin-footer">

<div class="container">

<p>

© 2026 Assam Finance Hub. All Rights Reserved.

</p>

</div>

</footer>

<!-- Admin JavaScript -->

<script type="module" src="admin.js"></script>

</body>

</html>
