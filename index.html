<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assam Finance Hub</title>

<style>
    *{
  margin:0;
  padding:0;
  box-sizing:border-box;
    }
body{
    margin:0;
    padding:20px;
    background:#f2f2f2;
    font-family:Arial,sans-serif;
}

.container{
    max-width:420px;
    margin:30px auto;
    background:#ffffff;
    padding:30px;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(0,0,0,.12);
    border-top:6px solid #0B5ED7;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
    font-size:16px;
   transition:0.3s;
}

   input:focus{
outline:none;
border:1px solid #0B5ED7;
box-shadow:0 0 8px rgba(11,94,215,.3);
   }
button{
    width:100%;
    padding:14px;
    margin-top:10px;
    background:linear-gradient(135deg,#0B5ED7,#1E88E5);
    color:#fff;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
   transition:0.3s;
box-shadow:0 8px 20px rgba(11,94,215,.35);
}

button:hover{
    transform:translateY(-2px);
box-shadow:0 12px 24px rgba(11,94,215,.45);
}
</style>

</head>

<body>
<div style="background:linear-gradient(135deg,#0B5ED7,#1E88E5);color:white;padding:25px;text-align:center;border-radius:0 0 20px 20px;margin-bottom:20px;">
<h1 style="margin:0;">🏦 Assam Finance Hub</h1>
<p>Fast • Secure • Trusted Two Wheeler Finance</p>
</div>
    
<div class="container">

<h2 style="margin-bottom:5px;color:#0B5ED7;">
🏦 Assam Finance Hub
</h2>

<p style="text-align:center;color:#666;font-size:15px;margin-bottom:20px;">
Fast • Secure • Trusted Two Wheeler Finance
</p>

<form id="loanForm">

<input
type="text"
id="name"
placeholder="Full Name"
required>

<input
type="tel"
id="mobile"
placeholder="Mobile Number"
required>
   
   <button type="button" id="sendOtpBtn">
Send OTP
   </button>

   <input
type="text"
id="otp"
placeholder="Enter OTP">
   
<input
type="text"
id="bike"
placeholder="Bike Model"
required>

<input
type="text"
id="city"
placeholder="City"
required>

<button type="submit">
Apply Now
</button>

   <p id="msg" style="text-align:center;color:green;margin-top:15px;font-weight:bold;"></p>
   
</form>
   
<div id="recaptcha-container"></div>
   
</div>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="script.js"></script>

</body>
</html>
