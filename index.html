<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assam Finance Hub</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f2f2f2;
padding:20px;
}
.container{
max-width:400px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}
input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}
button{
width:100%;
padding:12px;
background:#0a7cff;
color:#fff;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}
button:hover{
background:#005edb;
}
</style>
</head>

<body>

<div class="container">
<h2>Assam Finance Hub</h2>

<form id="loanForm">

<input type="text" id="name" placeholder="Full Name" required>

<input type="tel" id="mobile" placeholder="Mobile Number" required>

<input type="text" id="bike" placeholder="Bike Model" required>

<input type="text" id="city" placeholder="City" required>

<button type="submit">Apply Now</button>

</form>

</div>

<!-- Firebase -->
<script type="module" src="firebase-config.js"></script>
<script type="module" src="script.js"></script>

</body>
</html>
