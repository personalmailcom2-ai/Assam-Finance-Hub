<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assam Finance Hub</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#f2f2f2;
    font-family:Arial,sans-serif;
}

.container{
    max-width:400px;
    margin:40px auto;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    background:#007bff;
    color:#fff;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}
</style>

</head>

<body>

<div class="container">

<h2 style="margin-bottom:5px;color:#0B5ED7;">
🏦 Assam Finance Hub
</h2>

<p style="text-align:center;color:#666;font-size:15px;margin-bottom:20px;">
Fast • Secure • Trusted Two Wheeler Finance
</p>

<form id="loanForm">

<input
type="text"
id="name"
placeholder="Full Name"
required>

<input
type="tel"
id="mobile"
placeholder="Mobile Number"
required>

<input
type="text"
id="bike"
placeholder="Bike Model"
required>

<input
type="text"
id="city"
placeholder="City"
required>

<button type="submit">
Apply Now
</button>

</form>

</div>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="script.js"></script>

</body>
</html>
