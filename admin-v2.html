<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assam Finance Hub - Admin Panel</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

h2{
text-align:center;
margin-bottom:20px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-bottom:20px;
}

.box{
padding:15px;
border-radius:10px;
color:white;
text-align:center;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.total{
background:#2196F3;
}

.pending{
background:#FF9800;
}

.approved{
background:#4CAF50;
}

.rejected{
background:#F44336;
}

.card{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.2);
}

button{
padding:10px 18px;
margin:5px;
border:none;
border-radius:5px;
cursor:pointer;
color:white;
font-size:15px;
}

.approve{
background:green;
}

.reject{
background:red;
}

.delete{
background:#000;
}

</style>

</head>

<body>

<script>

const password=prompt("Enter Admin Password");

if(password!=="Assam@123"){

alert("Wrong Password");

window.location.href="index.html";

}

</script>

<h2>Loan Applications</h2>

<div class="dashboard">

<div class="box total">
<div id="total">0</div>
Total
</div>

<div class="box pending">
<div id="pending">0</div>
Pending
</div>

<div class="box approved">
<div id="approved">0</div>
Approved
</div>

<div class="box rejected">
<div id="rejected">0</div>
Rejected
</div>

</div>

<div id="list">

Loading...

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc,
deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyAnQFG-tdce0gxxfEhIYdpr6BJDcQgbW",

authDomain:"assam-finance-hub.firebaseapp.com",

projectId:"assam-finance-hub",

storageBucket:"assam-finance-hub.firebasestorage.app",

messagingSenderId:"989678663450",

appId:"1:989678663450:web:d0499bf58d8dd382325ea3"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const list=document.getElementById("list");

  async function loadData(){

list.innerHTML="";

let total=0;
let pending=0;
let approved=0;
let rejected=0;

const snapshot=await getDocs(collection(db,"applications"));

snapshot.forEach((d)=>{

const x=d.data();

if(!x.name || !x.mobile) return;

total++;

if(x.status=="Approved"){
approved++;
}else if(x.status=="Rejected"){
rejected++;
}else{
pending++;
}

list.innerHTML+=`

<div class="card">

<h3>${x.name}</h3>

<p><b>Mobile :</b> ${x.mobile}</p>

<p><b>Bike :</b> ${x.bike}</p>

<p><b>City :</b> ${x.city}</p>

<p><b>Status :</b> ${x.status || "Pending"}</p>

<button
class="approve"
onclick="changeStatus('${d.id}','Approved')">
Approve
</button>

<button
class="reject"
onclick="changeStatus('${d.id}','Rejected')">
Reject
</button>

<button
class="delete"
onclick="deleteApplication('${d.id}')">
Delete
</button>

</div>

`;

});

document.getElementById("total").innerHTML=total;
document.getElementById("pending").innerHTML=pending;
document.getElementById("approved").innerHTML=approved;
document.getElementById("rejected").innerHTML=rejected;

}

  window.changeStatus = async function(id,status){

await updateDoc(doc(db,"applications",id),{

status:status

});

alert("Status Updated Successfully");

loadData();

}

window.deleteApplication = async function(id){

const ok=confirm("Delete this application?");

if(!ok) return;

await deleteDoc(doc(db,"applications",id));

alert("Application Deleted");

loadData();

}

loadData();

</script>

</body>
</html>
